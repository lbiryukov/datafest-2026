<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataFest Tbilisi 2026: мой план</title>
<meta name="theme-color" content="#5a35e0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-column festival timetable; time rail on the left, parallel sessions stacked under each start time; sticky control bar on top. */
:root{
  --bg:#f4f3f9; --surface:#ffffff; --ink:#1b1830; --muted:#676383; --line:#dcd9ea;
  --accent:#5a35e0; --accent-soft:#ebe6ff; --on-accent:#ffffff;
  --top:#b25c00; --top-soft:#ffeccf; --good:#0b7a6b; --good-soft:#d8f3ee; --int:#b02a6f; --int-soft:#fbe1ee;
  --warn:#b3261e; --warn-soft:#fde4e1;
  --display:"Unbounded","Golos Text",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13111f; --surface:#1d1a2e; --ink:#eceaf7; --muted:#a29ebd; --line:#34304d;
  --accent:#a48dff; --accent-soft:#2b2450; --on-accent:#15122a;
  --top:#ffb85c; --top-soft:#3d2c12; --good:#5fd6c3; --good-soft:#12332f; --int:#ff8fc4; --int-soft:#3c1a2c;
  --warn:#ff8a80; --warn-soft:#3d1a18; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#13111f; --surface:#1d1a2e; --ink:#eceaf7; --muted:#a29ebd; --line:#34304d;
  --accent:#a48dff; --accent-soft:#2b2450; --on-accent:#15122a;
  --top:#ffb85c; --top-soft:#3d2c12; --good:#5fd6c3; --good-soft:#12332f; --int:#ff8fc4; --int-soft:#3c1a2c;
  --warn:#ff8a80; --warn-soft:#3d1a18; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
header.hero{padding:28px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.6vw,32px);line-height:1.15;margin:6px 0 8px;text-wrap:balance}
.sub{color:var(--muted);max-width:65ch;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg small{font-weight:500;opacity:.8}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.search{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px}
.spacer{flex:1}
.count{background:var(--on-accent);color:var(--accent);border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="false"] .count{background:var(--accent-soft)}
section.reco{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0 6px}
section.reco h2{font-family:var(--display);font-size:15px;font-weight:500;margin:0 0 6px}
section.reco p{margin:0 0 10px;color:var(--muted);max-width:68ch}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.route h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.route ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.route li{font-size:13.5px;display:grid;grid-template-columns:44px 1fr;gap:6px}
.route time{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);align-items:center}
h2.day{font-family:var(--display);font-size:18px;font-weight:700;margin:28px 0 4px}
.slot{display:grid;grid-template-columns:58px 1fr;gap:10px;padding-top:14px}
.slot>.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding-top:11px;color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:8px;min-width:0}
.svc{color:var(--muted);font-size:13.5px;padding:10px 0 2px;border-top:1px dashed var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 12px 11px 13px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;min-width:0}
.card.r-top{border-left-color:var(--top)} .card.r-good{border-left-color:var(--good)} .card.r-int{border-left-color:var(--int)}
.card.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card.picked.r-top{border-left-color:var(--top)} .card.picked.r-good{border-left-color:var(--good)} .card.picked.r-int{border-left-color:var(--int)}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.title{font-weight:600;font-size:15.5px;line-height:1.3;margin:3px 0 2px;overflow-wrap:anywhere}
.sp{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.ru{font-size:14px;margin:6px 0 0;max-width:66ch}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.tag.fmt{background:var(--bg)}
.why{grid-column:1/-1;font-size:13.5px;border-radius:7px;padding:7px 10px;display:flex;gap:8px;align-items:baseline}
.why b{white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.why.top{background:var(--top-soft)} .why.top b{color:var(--top)}
.why.good{background:var(--good-soft)} .why.good b{color:var(--good)}
.why.int{background:var(--int-soft)} .why.int b{color:var(--int)}
.clash{grid-column:1/-1;font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:7px;padding:6px 10px}
.pick{align-self:start;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:6px 11px;font-weight:600;font-size:13px;white-space:nowrap}
.pick[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.reg{font-size:13px;margin-top:6px}
.empty{color:var(--muted);padding:28px 0;max-width:60ch}
.gap{color:var(--muted);font-size:13px;padding:8px 0 0 68px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;max-width:calc(100% - 32px);z-index:9}
footer{margin-top:36px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:520px){ .slot{grid-template-columns:1fr;gap:4px} .slot>.t{padding-top:0} .card{grid-template-columns:1fr} .pick{justify-self:start} .gap{padding-left:0} }
@media (prefers-reduced-motion:no-preference){ .card{transition:border-color .15s} }

.status{font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--good)} .status.busy i{background:var(--top)} .status.err{color:var(--warn);border-color:var(--warn)} .status.err i{background:var(--warn)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;max-width:min(520px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,8,25,.45)}
dialog h2{font-family:var(--display);font-size:16px;font-weight:500;margin:0 0 8px}
dialog ol{padding-left:20px;margin:8px 0 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
dialog input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;margin:6px 0 10px}
.reco.connect{border-color:var(--accent);background:var(--accent-soft)}
.reco.connect p{color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer}
.err-text{color:var(--warn);font-size:13px;min-height:1em;margin:0 0 8px}
</style></head><body>
<div id="app"></div>
<script src="app.js?v=3"></script>
</body></html>
